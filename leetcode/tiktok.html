<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>TikTok LeetCode 高频题 · 灵神分类</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f7fb;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --text: #172033;
    --muted: #64748b;
    --border: #e2e8f0;
    --accent: #4f46e5;
    --accent-strong: #4338ca;
    --accent-soft: #eef2ff;
    --shadow: 0 12px 32px rgba(15, 23, 42, 0.07);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 12% -12%, rgba(99, 102, 241, 0.13), transparent 28rem),
      var(--bg);
    color: var(--text);
  }
  button, input, select { font: inherit; }
  header {
    min-height: 108px;
    padding: 20px clamp(20px, 4vw, 64px);
    display: flex;
    align-items: center;
    gap: 18px;
    color: #fff;
    background:
      radial-gradient(circle at 82% -50%, rgba(129, 140, 248, 0.65), transparent 24rem),
      linear-gradient(135deg, #111827 0%, #1e1b4b 58%, #312e81 100%);
    box-shadow: 0 12px 30px rgba(30, 27, 75, 0.2);
  }
  .company-mark {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 18px;
    background: rgba(255, 255, 255, 0.96);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
  }
  .company-mark img { width: 40px; height: 40px; object-fit: contain; }
  .company-mark span { display: none; font-size: 20px; font-weight: 800; color: var(--accent); }
  .company-mark.no-logo img { display: none; }
  .company-mark.no-logo span { display: block; }
  .header-copy { min-width: 0; }
  header h1 { margin: 0; font-size: clamp(20px, 2vw, 27px); font-weight: 750; letter-spacing: -0.03em; }
  header .subtitle { margin-top: 7px; color: #cbd5e1; font-size: 13px; }
  header .subtitle a { color: #fff; font-weight: 600; text-decoration: none; }
  header .subtitle a:hover { text-decoration: underline; text-underline-offset: 3px; }
  .header-actions { margin-left: auto; }
  .lang-btn {
    min-width: 48px;
    padding: 9px 14px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    cursor: pointer;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.05em;
    transition: background 160ms ease, transform 160ms ease;
  }
  .lang-btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-1px); }
  .filter-deck {
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid rgba(226, 232, 240, 0.9);
    background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
    backdrop-filter: blur(16px);
  }
  .controls {
    max-width: 1600px;
    margin: 0 auto;
    padding: 12px clamp(16px, 3vw, 34px) 10px;
    display: flex;
    gap: 10px 14px;
    flex-wrap: wrap;
    align-items: end;
  }
  .control-field { display: grid; gap: 6px; }
  .control-label {
    color: var(--muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1;
    text-transform: uppercase;
  }
  .controls select, .controls input[type=text] {
    height: 36px;
    padding: 0 11px;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    transition: border-color 150ms ease, box-shadow 150ms ease;
  }
  .controls select:focus, .controls input[type=text]:focus {
    border-color: #818cf8;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
  }
  .search-field { flex: 1 1 190px; max-width: 280px; }
  .search-field input { width: 100%; }
  .diff-btns {
    display: inline-flex;
    height: 36px;
    padding: 3px;
    gap: 2px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-soft);
  }
  .diff-btn {
    padding: 0 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: background 150ms ease, color 150ms ease, box-shadow 150ms ease;
  }
  .diff-btn:hover { color: var(--text); }
  .diff-btn.active { background: var(--surface); color: var(--accent); box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12); }
  .diff-btn[data-d="Easy"].active { color: #15803d; }
  .diff-btn[data-d="Medium"].active { color: #b45309; }
  .diff-btn[data-d="Hard"].active { color: #dc2626; }
  .toggle-group { display: flex; min-height: 36px; gap: 14px; align-items: center; flex-wrap: wrap; }
  .toggle-control { display: inline-flex; gap: 7px; align-items: center; color: #475569; cursor: pointer; font-size: 12px; font-weight: 600; }
  .toggle-control input { position: absolute; opacity: 0; pointer-events: none; }
  .toggle-track {
    position: relative;
    width: 34px;
    height: 20px;
    flex: 0 0 auto;
    border-radius: 999px;
    background: #cbd5e1;
    transition: background 160ms ease;
  }
  .toggle-track::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
    transition: transform 160ms ease;
  }
  .toggle-control input:checked + .toggle-track { background: var(--accent); }
  .toggle-control input:checked + .toggle-track::after { transform: translateX(14px); }
  .toggle-control input:focus-visible + .toggle-track { outline: 3px solid rgba(99, 102, 241, 0.2); outline-offset: 2px; }
  .stats-bar {
    max-width: 1600px;
    margin: 0 auto;
    padding: 0 clamp(16px, 3vw, 34px) 10px;
    display: flex;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
  }
  .stat-item { display: inline-flex; gap: 6px; align-items: baseline; padding: 5px 9px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface-soft); }
  .stat-item strong { color: var(--text); font-family: "JetBrains Mono", monospace; font-size: 12px; }
  .layout {
    width: min(1600px, 100%);
    min-height: calc(100vh - 210px);
    margin: 0 auto;
    padding: 22px clamp(16px, 3vw, 34px) 56px;
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr);
    gap: 22px;
    align-items: start;
  }
  .sidebar {
    max-height: calc(100vh - 165px);
    padding: 8px;
    overflow-y: auto;
    position: sticky;
    top: 145px;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.86);
    box-shadow: var(--shadow);
  }
  .cat-item {
    min-height: 38px;
    padding: 9px 10px 9px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    border-radius: 10px;
    color: #475569;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: background 140ms ease, color 140ms ease, transform 140ms ease;
  }
  .cat-item:hover { background: var(--surface-soft); color: var(--text); transform: translateX(2px); }
  .cat-item.active { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
  .cat-count { min-width: 26px; padding: 2px 6px; border-radius: 999px; background: #f1f5f9; color: #94a3b8; font-family: "JetBrains Mono", monospace; font-size: 11px; text-align: center; }
  .cat-item.active .cat-count { background: rgba(79, 70, 229, 0.1); color: var(--accent); }
  .main { min-width: 0; }
  .category-title {
    margin: 8px 0 14px;
    display: flex;
    align-items: center;
    gap: 9px;
    color: #111827;
    font-size: 21px;
    font-weight: 750;
    letter-spacing: -0.03em;
  }
  .category-total { padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: 0; }
  .subcat-block { margin-bottom: 28px; }
  .subcat-title {
    margin: 0 2px 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #334155;
    font-size: 14px;
    font-weight: 700;
  }
  .subcat-title::before { content: ''; width: 4px; height: 16px; border-radius: 999px; background: linear-gradient(#818cf8, #4f46e5); }
  .subcat-title .cnt { padding: 2px 7px; border-radius: 999px; background: #e2e8f0; color: var(--muted); font-size: 11px; font-weight: 600; }
  table {
    width: 100%;
    overflow: hidden;
    border: 1px solid var(--border);
    border-collapse: separate;
    border-spacing: 0;
    table-layout: fixed;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 8px 26px rgba(15, 23, 42, 0.045);
    font-size: 14px;
  }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #edf1f6; }
  th { background: var(--surface-soft); color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr td { transition: background 130ms ease; }
  tbody tr:hover td { background: #f8faff; }
  .col-id, td.id { width: 70px; }
  .col-diff { width: 92px; }
  .col-rating { width: 92px; }
  .col-freq { width: 118px; }
  .col-acc { width: 100px; }
  .col-cat { width: 28%; }
  td.id { color: #94a3b8; font-family: "JetBrains Mono", monospace; font-size: 12px; }
  td.title { overflow-wrap: anywhere; }
  td.title a { color: #1e293b; font-weight: 600; line-height: 1.45; text-decoration: none; }
  td.title a:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .diff { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .diff-Easy { background: #dcfce7; color: #15803d; }
  .diff-Medium { background: #fff7d6; color: #a16207; }
  .diff-Hard { background: #fee2e2; color: #dc2626; }
  .col-rating { display: none; }
  body.show-rating .col-rating { display: table-cell; }
  .rating-score { color: var(--accent); font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; }
  .rating-na { color: #cbd5e1; }
  td.freq { color: #475569; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .freq-bar { display: inline-block; height: 5px; margin-right: 7px; border-radius: 999px; background: linear-gradient(90deg, #818cf8, #4f46e5); vertical-align: middle; }
  .cat-tags { color: #94a3b8; font-size: 11px; }
  .cat-tag { display: inline-block; margin: 2px 3px 2px 0; padding: 3px 6px; border-radius: 6px; background: #f1f5f9; }
  tr.basic td { background: #fffdf3; }
  tr.basic:hover td { background: #fff9db; }
  .star { margin-right: 5px; color: #eab308; }
  .basic-src { margin-left: 7px; color: #b88708; font-size: 11px; }
  .empty { padding: 64px 24px; border: 1px dashed #cbd5e1; border-radius: 16px; background: rgba(255, 255, 255, 0.65); color: var(--muted); text-align: center; }

  @media (max-width: 768px) {
    header { min-height: 84px; padding: 14px 16px; gap: 11px; }
    .company-mark { width: 48px; height: 48px; border-radius: 14px; }
    .company-mark img { width: 30px; height: 30px; }
    header h1 { overflow: hidden; font-size: 16px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
    .subtitle { display: none; }
    .lang-btn { min-width: 42px; padding: 7px 10px; }
    .filter-deck { position: relative; }
    .controls { padding: 12px 14px 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: end; }
    .control-field { min-width: 0; }
    .controls select, .controls input[type=text] { width: 100%; }
    .search-field { max-width: none; }
    .diff-btns { width: 100%; }
    .diff-btn { flex: 1; padding: 0 5px; }
    .toggle-group { grid-column: 1 / -1; min-height: 30px; gap: 12px; }
    .stats-bar { padding: 0 14px 11px; overflow-x: auto; scrollbar-width: none; }
    .stats-bar::-webkit-scrollbar { display: none; }
    .stat-item { flex: 0 0 auto; }
    .layout { padding: 14px 0 40px; display: block; }
    .sidebar {
      width: 100%;
      max-height: none;
      margin: 0 0 16px;
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 9px 14px;
      display: flex;
      gap: 6px;
      border-width: 1px 0;
      border-radius: 0;
      overflow-x: auto;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.05);
      backdrop-filter: blur(12px);
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .sidebar::-webkit-scrollbar { display: none; }
    .cat-item {
      min-height: 32px;
      padding: 6px 10px;
      white-space: nowrap;
      flex-shrink: 0;
      border-radius: 999px;
      background: #f1f5f9;
      font-size: 12px;
    }
    .cat-item:hover { transform: none; }
    .cat-item.active { background: var(--accent); color: #fff; }
    .cat-item.active .cat-count { background: rgba(255, 255, 255, 0.16); color: rgba(255, 255, 255, 0.85); }
    .main { padding: 0 14px; }
    .category-title { margin: 10px 0 12px; font-size: 18px; }
    .subcat-block { margin-bottom: 22px; }
    .subcat-title { font-size: 13px; }
    table { border-radius: 12px; font-size: 13px; }
    th, td { padding: 8px; }
    th { font-size: 11px; }
    .col-id, td.id { width: 48px; }
    .col-diff { width: 84px; }
    .col-rating { width: 88px; }
    .col-freq { width: 92px; }
    td.id { font-size: 11px; }
    .cat-tags, th.col-cat, td.col-cat { display: none; }
    th.col-acc, td.col-acc { display: none; }
    .freq-bar { display: none; }
    .basic-src { display: none; }
  }
  @media (max-width: 420px) {
    .controls { grid-template-columns: 1fr; }
    .toggle-group { grid-column: auto; }
    .toggle-control { font-size: 12px; }
    .stats-bar { gap: 6px; }
    .stat-item { padding: 4px 7px; }
    th.col-diff, td.col-diff { display: none; }
    td.title::before { content: ''; display: inline-block; }
    tr.easy-row td.title::before,
    tr.medium-row td.title::before,
    tr.hard-row td.title::before {
      width: 6px; height: 6px; border-radius: 50%; margin-right: 6px;
    }
    tr.easy-row td.title::before { background: #16a34a; }
    tr.medium-row td.title::before { background: #ca8a04; }
    tr.hard-row td.title::before { background: #dc2626; }
  }
</style>
</head>

<header>
  <div class="company-mark">
    <img src="logos/tiktok.svg" alt="TikTok" onerror="this.parentElement.classList.add('no-logo')">
    <span>TikTok</span>

  <div class="header-copy">
    <h1 id="page-title">TikTok LeetCode 高频题 · 灵神分类</h1>

  </div>
  <div class="header-actions">
    <button class="lang-btn" id="lang-btn">EN</button>
  </div>
</header>
<div class="filter-deck">
  <div class="controls">
    <label class="control-field"><span class="control-label l-tf">时间段</span>

        <option value="30d" class="tf-30d">最近 30 天</option>
        <option value="3m" class="tf-3m">最近 3 个月</option>
        <option value="6m" class="tf-6m">最近 6 个月</option>
        <option value="6m_plus" class="tf-6mp">6 个月以前</option>
        <option value="all" class="tf-all" selected>全部</option>
      </select>
    </label>
    <label class="control-field"><span class="control-label l-diff">难度</span>
      <span class="diff-btns" id="diff-btns">
        <button class="diff-btn active" data-d="all"><span class="l-all">全部</span></button>
        <button class="diff-btn" data-d="Easy">Easy</button>
        <button class="diff-btn" data-d="Medium">Medium</button>
        <button class="diff-btn" data-d="Hard">Hard</button>
      </span>
    </label>
    <label class="control-field"><span class="control-label l-freq">最小频率</span>
      <select id="min-freq">

        <option value="25">≥ 25%</option>

        <option value="75">≥ 75%</option>
      </select>

      <label class="toggle-control">
        <input type="checkbox" id="basic-only">

      <label class="toggle-control">

        <span class="toggle-track"></span>
        <span class="l-rating-toggle">显示周赛难度分</span>
      </label>
    </div>
  </div>
  <div class="stats-bar" id="stats"></div>
</div>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"></div>
</div>

function tCat(zh) {
  if (state.lang === 'zh') return zh;
  if (LABELS_EN[zh]) return LABELS_EN[zh];
  if (zh.includes('·')) {
    return zh.split('·').map(p => LABELS_EN[p] || p).join(' · ');
  }
  return zh;
}

function problemTitle(p) {
  return state.lang === 'zh' ? p.title_zh : p.title;
}

function problemUrl(p) {
  const host = state.lang === 'zh' ? 'https://leetcode.cn' : 'https://leetcode.com';
  return `${host}/problems/${p.slug}/`;
}

function getFreq(p) {
  return p.freq[state.timeframe] ?? 0;
}

function problemPassesFilters(p) {
  if (state.difficulty !== 'all' && p.difficulty !== state.difficulty) return false;
  const f = p.freq[state.timeframe];
  if (f === undefined) return false;
  if (f < state.minFreq) return false;
  if (state.basicOnly && !p.basic) return false;
  if (state.search) {
    const q = state.search.toLowerCase();
    const titles = [p.title, p.title_zh || ''];
    if (!titles.some(t => t.toLowerCase().includes(q)) && !String(p.id).includes(q)) return false;
  }
  return true;
}

function buildCategoryIndex() {
  // returns { mainCat: { subCat: [problem, ...], _total: [problem, ...] } }
  // and "未分类" bucket for problems with no category
  const idx = {};
  for (const mc of DATA.main_categories) idx[mc] = { _all: [] };
  idx['未分类'] = { _all: [] };
  for (const p of DATA.problems) {
    if (!problemPassesFilters(p)) continue;
    if (p.categories.length === 0) {
      idx['未分类']._all.push(p);
      (idx['未分类']['(未分类)'] = idx['未分类']['(未分类)'] || []).push(p);
    } else {
      const seen = new Set();
      for (const [mc, sc] of p.categories) {
        idx[mc]._all.push(p);
        (idx[mc][sc] = idx[mc][sc] || []).push(p);
        seen.add(mc);
      }
    }
  }
  // dedupe _all within each main cat
  for (const mc in idx) {
    const seen = new Set();
    idx[mc]._all = idx[mc]._all.filter(p => {
      if (seen.has(p.id)) return false;
      seen.add(p.id);
      return true;
    });
    idx[mc]._all.sort((a, b) => getFreq(b) - getFreq(a));
    for (const sc in idx[mc]) {
      if (sc === '_all') continue;
      idx[mc][sc].sort((a, b) => getFreq(b) - getFreq(a));
    }
  }
  return idx;
}

function renderSidebar(idx) {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '';
  const cats = [...DATA.main_categories, '未分类'];
  const totalMatched = cats.reduce((s, c) => s + idx[c]._all.length, 0);
  const all = document.createElement('div');
  all.className = 'cat-item' + (state.activeCat === null ? ' active' : '');
  all.innerHTML = `<span>${t().allCats}</span><span class="cat-count">${totalMatched}</span>`;
  all.onclick = () => { state.activeCat = null; rerender(); };
  sb.appendChild(all);
  for (const mc of cats) {
    const n = idx[mc]._all.length;
    if (n === 0) continue;
    const el = document.createElement('div');
    el.className = 'cat-item' + (state.activeCat === mc ? ' active' : '');
    el.innerHTML = `<span>${tCat(mc)}</span><span class="cat-count">${n}</span>`;
    el.onclick = () => { state.activeCat = mc; rerender(); };
    sb.appendChild(el);
  }
}

function renderMain(idx) {
  const main = document.getElementById('main');
  main.innerHTML = '';
  const cats = state.activeCat ? [state.activeCat] : [...DATA.main_categories, '未分类'];
  let anyShown = false;
  for (const mc of cats) {
    if (idx[mc]._all.length === 0) continue;
    anyShown = true;
    const catBlock = document.createElement('div');
    if (!state.activeCat) {
      const h = document.createElement('h2');
      h.className = 'category-title';
      const label = document.createElement('span');
      label.textContent = tCat(mc);
      const count = document.createElement('span');
      count.className = 'category-total';
      count.textContent = idx[mc]._all.length;
      h.append(label, count);
      catBlock.appendChild(h);
    }
    // Preserve 灵神's original subcategory order; append any unknown at end.
    const canonical = (DATA.subcat_order && DATA.subcat_order[mc]) || [];
    const present = Object.keys(idx[mc]).filter(k => k !== '_all');
    const subs = [];
    for (const s of canonical) if (idx[mc][s]) subs.push(s);
    for (const s of present) if (!subs.includes(s)) subs.push(s);
    for (const sc of subs) {
      const problems = idx[mc][sc];
      const block = document.createElement('div');
      block.className = 'subcat-block';
      block.innerHTML = `<div class="subcat-title">${tCat(sc)}<span class="cnt">${t().problemsCount(problems.length)}</span></div>`;
      block.appendChild(buildTable(problems));
      catBlock.appendChild(block);
    }
    main.appendChild(catBlock);
  }
  if (!anyShown) {
    main.innerHTML = `<div class="empty">${t().empty}</div>`;
  }
}

function buildTable(problems) {
  const tbl = document.createElement('table');
  const l = t();
  tbl.innerHTML = `<thead><tr>
    <th class="col-id">${l.colId}</th><th class="col-title">${l.colTitle}</th>
    <th class="col-diff">${l.colDiff}</th>
    <th class="col-rating">${l.colRating}</th>
    <th class="col-freq">${l.colFreq}</th>
    <th class="col-acc">${l.colAcc}</th>
    <th class="col-cat">${l.colCat}</th>
  </tr></thead>`;
  const tb = document.createElement('tbody');
  const srcLabels = {
    blind_75: 'Blind75', grind_75: 'Grind75', neetcode_250: 'NC250',
    lc_75: 'LC75', top_100: 'Hot100', interview_150: 'Int150',
  };
  for (const p of problems) {
    const f = getFreq(p);
    const tr = document.createElement('tr');
    const rowClasses = [];
    if (p.basic) rowClasses.push('basic');
    rowClasses.push(p.difficulty.toLowerCase() + '-row');
    tr.className = rowClasses.join(' ');
    const tags = p.categories.map(([m, s]) =>
      `<span class="cat-tag">${tCat(m)}·${tCat(s)}</span>`).join('');
    const star = p.basic ? '<span class="star" title="Basic problem">★</span>' : '';
    const srcs = (p.basic_sources || []).map(s => srcLabels[s] || s).join(' · ');
    const srcTag = srcs ? `<span class="basic-src" title="${srcs}">${srcs}</span>` : '';
    const rating = p.rating == null
      ? '<span class="rating-na">—</span>'
      : `<span class="rating-score" title="${p.rating.toFixed(2)}">${Math.round(p.rating)}</span>`;
    tr.innerHTML = `
      <td class="id">${p.id}</td>
      <td class="title">${star}<a href="${problemUrl(p)}" target="_blank" rel="noopener">${problemTitle(p)}</a>${srcTag}</td>
      <td class="col-diff"><span class="diff diff-${p.difficulty}">${p.difficulty}</span></td>
      <td class="col-rating">${rating}</td>
      <td class="freq col-freq"><span class="freq-bar" style="width:${Math.max(2, f)}px"></span>${f.toFixed(1)}%</td>
      <td class="freq col-acc">${p.acceptance.toFixed(1)}%</td>
      <td class="cat-tags col-cat">${tags || '<span style="color:#d1d5db">—</span>'}</td>
    `;
    tb.appendChild(tr);
  }
  tbl.appendChild(tb);
  return tbl;
}

function updateStats(idx) {
  const total = DATA.problems.length;
  const matched = [...DATA.main_categories, '未分类'].reduce(
    (s, c) => s + idx[c]._all.length, 0);
  const uncat = idx['未分类']._all.length;
  document.getElementById('stats').innerHTML = t().stats(total, matched, uncat);
}

function applyStaticText() {
  const l = t();
  document.title = l.pageTitle;
  document.getElementById('page-title').textContent = l.pageTitle;
  document.getElementById('page-subtitle').firstChild.nodeValue = l.subtitle;
  document.getElementById('back-link').textContent = l.back;
  document.getElementById('lang-btn').textContent = l.langBtn;
  document.querySelector('.l-tf').textContent = l.timeframe;
  document.querySelector('.l-diff').textContent = l.difficulty;
  document.querySelector('.l-freq').textContent = l.minFreq;
  document.querySelector('.l-search').textContent = l.search;
  document.querySelector('.l-all').textContent = l.all;
  document.querySelector('.tf-6m').textContent = l.tf6m;
  document.querySelector('.tf-30d').textContent = l.tf30d;
  document.querySelector('.tf-3m').textContent = l.tf3m;
  document.querySelector('.tf-6mp').textContent = l.tf6mp;
  document.querySelector('.tf-all').textContent = l.tfAll;
  document.querySelector('.mf-0').textContent = l.mfNone;
  document.getElementById('search').placeholder = l.searchPh;
  const basicLabel = document.querySelector('.l-basic');
  basicLabel.textContent = l.basic;
  basicLabel.parentElement.title = l.basicHint;
  const ratingLabel = document.querySelector('.l-rating-toggle');
  ratingLabel.textContent = l.ratingToggle;
  ratingLabel.parentElement.title = l.ratingHint;
  document.body.classList.toggle('show-rating', state.showRating);
  document.documentElement.lang = state.lang === 'zh' ? 'zh' : 'en';
}

function rerender() {
  applyStaticText();
  const idx = buildCategoryIndex();
  renderSidebar(idx);
  renderMain(idx);
  updateStats(idx);
}

// wire up
document.getElementById('timeframe').addEventListener('change', e => {
  state.timeframe = e.target.value; rerender();
});
document.getElementById('min-freq').addEventListener('change', e => {
  state.minFreq = Number(e.target.value); rerender();
});
document.getElementById('search').addEventListener('input', e => {
  state.search = e.target.value; rerender();
});
document.querySelectorAll('.diff-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.difficulty = btn.dataset.d;
    rerender();
  });
});
document.getElementById('lang-btn').addEventListener('click', () => {
  state.lang = state.lang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', state.lang);
  rerender();
});
document.getElementById('basic-only').addEventListener('change', e => {
  state.basicOnly = e.target.checked;
  rerender();
});
document.getElementById('show-rating').addEventListener('change', e => {
  state.showRating = e.target.checked;
  document.body.classList.toggle('show-rating', state.showRating);
});
rerender();
</script>
</body>
</html>
