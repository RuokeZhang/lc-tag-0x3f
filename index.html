<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>LeetCode Company Interview Problems · Categorized</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    color: #fff;
    min-height: 100vh;
  }
  .container { max-width: 960px; margin: 0 auto; padding: 60px 20px; }
  .top-bar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
  .lang-btn {
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.3);
    background: transparent;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .lang-btn:hover { background: rgba(255,255,255,0.1); }
  h1 { font-size: 36px; margin: 0 0 8px; }
  .subtitle { color: #a3a4b8; font-size: 15px; margin-bottom: 40px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 24px;
    text-decoration: none;
    color: #fff;
    transition: all 0.2s;
    display: block;
  }
  .card:hover {
    background: rgba(255,255,255,0.1);
    border-color: #4f46e5;
    transform: translateY(-2px);
  }
  .card-title { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
  .card-num { font-size: 40px; font-weight: 700; color: #7c8aff; line-height: 1; }
  .card-sub { color: #a3a4b8; font-size: 13px; margin-top: 8px; }
  .footer { color: #6b6c85; font-size: 12px; margin-top: 40px; }
  .footer a { color: #7c8aff; }
</style>
</head>
<body>
<div class="container">
  <div class="top-bar"><button class="lang-btn" id="lang-btn">EN</button></div>
  <h1 id="h1">LeetCode 公司高频题</h1>
  <div class="subtitle" id="subtitle">按 灵茶山艾府 (0x3F) 题单分类 · 每个子分类内按 Frequency 从高到低排序</div>
  <div class="cards" id="cards">

        <a class="card" href="google.html" data-total="2274" data-categorized="1606">
          <div class="card-title">Google</div>
          <div class="card-num">2274</div>
          <div class="card-sub"></div>
        </a>

        <a class="card" href="bloomberg.html" data-total="1190" data-categorized="832">
          <div class="card-title">Bloomberg</div>
          <div class="card-num">1190</div>
          <div class="card-sub"></div>
        </a>

        <a class="card" href="meta.html" data-total="1366" data-categorized="965">
          <div class="card-title">Meta</div>
          <div class="card-num">1366</div>
          <div class="card-sub"></div>
        </a>
  </div>
  <div class="footer" id="footer">
    数据来源: <a href="https://github.com/snehasishroy/leetcode-companywise-interview-questions">snehasishroy/leetcode-companywise-interview-questions</a> ·
    分类参考: <a href="https://leetcode.cn/u/endlesscheng/">灵茶山艾府</a>
  </div>
</div>
<script>
const UI = {
  zh: {
    title: 'LeetCode 公司高频题',
    subtitle: '按 灵茶山艾府 (0x3F) 题单分类 · 每个子分类内按 Frequency 从高到低排序',
    btn: 'EN',
    problems: '题',
    categorized: '已分类',
    footer: '数据来源: <a href="https://github.com/snehasishroy/leetcode-companywise-interview-questions">snehasishroy/leetcode-companywise-interview-questions</a> · 分类参考: <a href="https://leetcode.cn/u/endlesscheng/">灵茶山艾府</a>',
  },
  en: {
    title: 'LeetCode Company Interview Problems',
    subtitle: 'Categorized by 灵茶山艾府 (0x3F) · Sorted by frequency within each subcategory',
    btn: '中',
    problems: 'problems',
    categorized: 'categorized',
    footer: 'Data: <a href="https://github.com/snehasishroy/leetcode-companywise-interview-questions">snehasishroy/leetcode-companywise-interview-questions</a> · Categories: <a href="https://leetcode.cn/u/endlesscheng/">灵茶山艾府</a>',
  },
};
function applyLang(lang) {
  const l = UI[lang];
  document.getElementById('h1').textContent = l.title;
  document.getElementById('subtitle').textContent = l.subtitle;
  document.getElementById('lang-btn').textContent = l.btn;
  document.getElementById('footer').innerHTML = l.footer;
  document.title = l.title;
  document.documentElement.lang = lang;
  // Update card sub text
  document.querySelectorAll('.card').forEach(card => {
    const sub = card.querySelector('.card-sub');
    const n = card.dataset.total;
    const c = card.dataset.categorized;
    const pct = Math.round(100 * c / n);
    sub.textContent = lang === 'zh'
      ? `${l.problems} · ${l.categorized} ${c} (${pct}%)`
      : `${l.problems} · ${c} ${l.categorized} (${pct}%)`;
  });
}
const savedLang = localStorage.getItem('lang') || 'zh';
document.getElementById('lang-btn').addEventListener('click', () => {
  const cur = localStorage.getItem('lang') || 'zh';
  const next = cur === 'zh' ? 'en' : 'zh';
  localStorage.setItem('lang', next);
  applyLang(next);
});
applyLang(savedLang);
</script>
</body>
</html>
